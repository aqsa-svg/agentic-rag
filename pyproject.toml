[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arag"
version = "0.1.0"
description = "Agentic RAG over Indian health insurance policy wordings"
requires-python = ">=3.11"

# Deliberately thin. The eval harness must be runnable with no ML stack installed
# so that `make eval-fast` stays fast and CI stays cheap. Heavy deps are extras.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed for `make eval` (full, live). Not installed in the PR CI job.
ragas = ["ragas>=0.2", "datasets>=2.19", "langchain-core>=0.3"]
# Ingest / index. Local GPU only, never installed in the Vercel bundle.
offline = ["pymupdf>=1.24", "sentence-transformers>=3.0", "torch>=2.3"]
# Online inference inside the Vercel function. No torch.
online = ["onnxruntime>=1.18", "tokenizers>=0.19", "psycopg[binary]>=3.2"]
# The deployed service. Kept separate from `online` so the container installs the
# web layer without the inference stack until retrieval actually lands.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
arag-eval = "arag.eval.cli:app"
arag-ingest = "arag.ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arag"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not live and not slow'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires network and real model access; excluded from the PR gate",
    # Full-corpus passes over 197 PDF pages. Fast standalone (~30s) but minutes under
    # coverage instrumentation, so they run in the nightly rather than blocking a PR.
    "slow: full-corpus pass; run in the nightly, not the PR gate",
    # Asserts a property of the real PDFs, which are copyrighted and never committed, so
    # these skip in CI rather than being rewritten against a fixture. A fixture cannot
    # catch the failure they exist for: the bug was that the index disagreed with the
    # document, and a fixture built from the index would agree with it by construction.
    "needs_corpus: requires the fetched PDFs in data/raw; skipped when absent",
]

[tool.coverage.run]
source = ["src/arag"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001/2/3 flag "ambiguous" Unicode - confusable or invisible characters. These two
# files exist SPECIFICALLY to handle those characters (ligatures, soft hyphens, NBSP,
# curly quotes), so the rule flags their entire subject matter. Escaping every literal
# would make the punctuation-folding table unreviewable: `"’": "'"` tells a reviewer
# less than `"’": "'"` with a comment. The rule stays on everywhere else, which is
# where it earns its place - see probe.py, whose SOFT_HYPHEN/NBSP constants ARE escaped
# because there a stray literal would be invisible rather than intentional.
"src/arag/ingest/normalise.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ingest_normalise.py" = ["RUF001", "RUF002", "RUF003"]
# The Space entrypoint must extend sys.path before importing `arag`, which is exactly
# what E402 forbids. The alternative - publishing the package to an index just so a
# deploy can import it - adds a release step to every deploy for no benefit.
"deploy/hfspace-gradio/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arag"]

# PyMuPDF ships no type stubs, so every call into it is "untyped" under strict mode.
# Relaxing that check for this one module is preferable to sprinkling `# type: ignore`
# through the probe, which would also suppress genuine errors in our own code.
[[tool.mypy.overrides]]
module = "pymupdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "arag.ingest.probe",
    "arag.ingest.cli",
    "arag.ingest.clause_index",
    "arag.ingest.tables",
    "arag.ingest.chunk",
    "arag.index.build",
]
disallow_untyped_calls = false
