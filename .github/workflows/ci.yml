name: ci

# Two-tier evaluation, per DESIGN §7. The scope of each tier is written here on purpose:
# this gate was red from the first commit to day 5 because nobody had written down what it
# was FOR, so every failure looked like a bug to patch rather than a question to answer.
#
# PR gate — WHAT IT IS: offline, deterministic, `.[dev]`-only, fast (seconds), no API keys,
#   no corpus PDFs, no ML stack. WHAT IT CHECKS: that the code is well-formed (lint, format,
#   types for the modules whose deps are installed) and the deterministic parts behave
#   (unit tests, a coverage floor, and that the eval harness RUNS end to end). WHAT IT DOES
#   NOT CHECK: quality. A `.[dev]`-only gate cannot score retrieval or generation - it has
#   no embedder, no corpus and no model - so it must not pretend to. The eval step runs the
#   null engine in --smoke mode: it asserts the harness completes, never that a null engine
#   scores well (it cannot, and once real labels landed, asserting thresholds here turned
#   the gate red for doing exactly what a null engine does).
#
# Nightly — WHERE QUALITY IS MEANT TO LIVE. Currently it still runs the null engine in
#   smoke mode too, because the real quality gate is not yet operational: no live engine is
#   wired into the registry (only null/echo/bm25), and CI has neither the corpus PDFs
#   (copyrighted, gitignored) nor recorded cassettes to run bm25 against. Enabling the real
#   gate is a tracked item - see DESIGN §7 and LIMITATIONS - not something to fake by
#   asserting thresholds against an engine that returns nothing.
#
# The split exists because a gate that flakes on a 15 RPM rate limit is a gate people
# learn to re-run instead of read. Determinism is the feature. So is honesty about scope:
# a gate that is green must be green for a reason it actually checks.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:30 UTC daily. Live models, full golden set.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  ARAG_ENV: ci

jobs:
  gate:
    name: PR gate (offline, deterministic)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Typecheck
        run: mypy

      - name: Validate golden set
        # A hard gate now: the set is 30 human-authored items with every stratum floor met,
        # so `validate` exits 0. It fails the build if a label becomes unresolvable or the
        # composition regresses - a broken golden set is a broken harness, not a quality dip.
        run: arag-eval validate

      - name: Tests with coverage floor
        # -rs prints the reason for every skip. The offline gate SKIPS its hardest tests -
        # the dense/offline stack (no numpy/torch here) and the corpus tests (no PDFs) - and
        # a gate that skips silently is green-while-checking-a-subset, the exact failure this
        # workflow's history records. The skip count is surfaced in the job summary below.
        run: |
          pytest -m "not live" -rs --cov --cov-report=term-missing --cov-fail-under=70 \
            | tee pytest-out.txt

      - name: Surface skipped tests in the job summary
        if: always()
        # Make the skips loud. If the number jumps, someone has moved a real check behind a
        # skip, and this line is where they will see it without reading the full log.
        run: |
          {
            echo "### Test skips (offline gate)"
            echo '```'
            grep -E "^SKIPPED|skipped" pytest-out.txt | tail -40 || echo "none"
            echo '```'
            grep -oE "[0-9]+ skipped" pytest-out.txt | tail -1 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Eval smoke test (harness runs; thresholds NOT enforced here)
        # --smoke: assert the harness runs the set to completion, not that the null engine
        # scores well. Exit 2 = a broken harness (invalid golden set, stale cassette, bad
        # config) and still fails. The real quality gate, against a real engine, is the
        # nightly's job - see the header comment. This step used to omit --smoke, so a null
        # engine scoring 0 reddened the gate the moment real labels landed.
        run: arag-eval run --engine null --fast --smoke

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-${{ github.sha }}
          path: |
            EVAL_LOG.md
            data/eval_runs.jsonl
          if-no-files-found: ignore

  nightly:
    name: Nightly full eval (live models)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets are injected here only. The PR job above never has them in scope, so a
      # fork PR cannot exfiltrate a key and cannot spend the API budget.
      ARAG_GEMINI_API_KEY: ${{ secrets.ARAG_GEMINI_API_KEY }}
      ARAG_DATABASE_URL: ${{ secrets.ARAG_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # offline too: the nightly is where the modules the PR gate cannot type-check (the
        # dense/ML stack) get checked, with their dependencies actually present.
        run: python -m pip install -e ".[dev,ragas,offline]"

      - name: Typecheck the offline modules the PR gate skips
        # The PR gate excludes these (deps not installed there - see pyproject [tool.mypy]).
        # Explicit paths override that exclude, and here their deps ARE installed, so this is
        # the run that actually checks them.
        run: mypy src/arag/index/dense.py src/arag/local/reranker.py src/arag/local/transformers_provider.py

      - name: Full eval
        # Concurrency stays low: the generator sits behind a 15 RPM free tier and an
        # unbounded fan-out would spend the run in backoff, making latency numbers useless.
        #
        # STILL --smoke, and still the null engine, DELIBERATELY: the real quality gate is
        # not yet operational (no live engine in the registry, no corpus/cassettes in CI),
        # so asserting thresholds here would redden the nightly for a gap in wiring, not a
        # regression. When a live engine lands, this becomes `--engine <live>` without
        # --smoke and the thresholds bite. Tracked in DESIGN §7.
        run: arag-eval run --engine null --concurrency 2 --smoke

      - name: Commit updated metric history
        # The v1 -> v2 -> v3 metric log is the most valuable artefact this project
        # produces, so the nightly writes it back rather than leaving it in an artefact
        # that expires in 90 days.
        run: |
          if [ -n "$(git status --porcelain EVAL_LOG.md data/eval_runs.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add EVAL_LOG.md data/eval_runs.jsonl
            git commit -m "chore(eval): nightly run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no metric change"
          fi

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-${{ github.run_id }}
          path: |
            EVAL_LOG.md
            data/eval_runs.jsonl
          if-no-files-found: ignore
